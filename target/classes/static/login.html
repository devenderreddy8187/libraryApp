<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Library</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --muted: #94a3b8;
            --primary: #2563eb;
            --primary-600: #1d4ed8;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --card: #0b1220;
            --border: #1f2937;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell,
                Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            background: linear-gradient(135deg, #0b1220, #0f172a 60%);
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .login-subtitle {
            color: var(--muted);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .form-input {
            width: 100%;
            background: var(--card);
            color: #e5e7eb;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--primary);
        }
        .login-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .login-btn:hover {
            background: var(--primary-600);
        }
        .demo-credentials {
            margin-top: 24px;
            padding: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            color: var(--muted);
        }
        .demo-credentials h4 {
            margin: 0 0 12px 0;
            color: #e5e7eb;
            font-size: 14px;
        }
        .credential-item {
            margin-bottom: 8px;
        }
        .credential-item:last-child {
            margin-bottom: 0;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-title">📚 Library</div>
            <div class="login-subtitle">Sign in to access your account</div>
        </div>

        <div id="error-message" class="error-message"></div>

        <form id="login-form" action="/login" method="post">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="demo-credentials">
            <h4>Demo Credentials:</h4>
            <div class="credential-item">
                <strong>User:</strong> user / password
            </div>
            <div class="credential-item">
                <strong>Admin:</strong> admin / admin
            </div>
        </div>

        <div class="back-link">
            <a href="/">← Back to Library</a>
            <button onclick="testLoginEndpoint()" style="margin-left: 20px; background: var(--warning); color: #0b1220; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Test Login Endpoint</button>
        </div>
    </div>

    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        
        if (error) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'block';
            errorDiv.textContent = 'Invalid username or password. Please try again.';
        }

       
        document.getElementById('login-form').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            console.log('Form submission started');
            console.log('Username:', username);
            console.log('Password length:', password.length);
            
            if (!username || !password) {
                e.preventDefault();
                const errorDiv = document.getElementById('error-message');
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Please fill in all fields.';
                return false;
            }
            
           
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'none';
            
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Signing In...';
            submitBtn.disabled = true;
            
            console.log('Form submission proceeding...');
        });
        
        
        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('error-message').style.display = 'none';
        });
        
        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('error-message').style.display = 'none';
        });
        
       
        async function testLoginEndpoint() {
            try {
                console.log('Testing login endpoint...');
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'username=admin&password=admin'
                });
                
                console.log('Login test response:', response);
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.redirected) {
                    console.log('Redirected to:', response.url);
                    alert(`Login endpoint test: Redirected to ${response.url}`);
                } else {
                    alert(`Login endpoint test: Status ${response.status}`);
                }
            } catch (error) {
                console.error('Login endpoint test error:', error);
                alert(`Login endpoint test error: ${error.message}`);
            }
        }
    </script>
</body>
</html>
